services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: study_sheets
      POSTGRES_USER: study_sheets
      POSTGRES_PASSWORD: study_sheets_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_sheets -d study_sheets"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
