name: CI
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: study_sheets
          POSTGRES_USER: study_sheets
          POSTGRES_PASSWORD: study_sheets_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U study_sheets -d study_sheets"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://study_sheets:study_sheets_dev@127.0.0.1:5432/study_sheets
      PROGRESS_TEST_DATABASE_URL: postgresql+psycopg://study_sheets:study_sheets_dev@127.0.0.1:5432/study_sheets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend
