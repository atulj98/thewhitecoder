<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta
      name="description"
      content="Learn data structures and algorithms from the beginning with The White Coder's guided DSA roadmap and curated practice questions."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="The White Coder | Learn DSA step by step"
    />
    <meta
      property="og:description"
      content="A clear DSA roadmap from fundamentals to advanced problem solving, with curated practice questions."
    />
    <title>The White Coder | Learn DSA step by step</title>
    <script>
      try {
        const saved = localStorage.getItem("the-white-coder-theme");
        const theme = saved === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0c0c0d" : "#f5f5f5";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
