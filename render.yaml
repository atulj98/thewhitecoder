# Paid API and PostgreSQL resources. Review Render's displayed charges before
# creating this Blueprint. The frontend continues to deploy through GitHub Pages.
services:
  - type: web
    name: thewhitecoder-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    preDeployCommand: python -m app.release
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    domains:
      - api.thewhitecoder.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thewhitecoder-postgres
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGINS
        value: '["https://thewhitecoder.com","https://www.thewhitecoder.com"]'
      - key: COOKIE_SECURE
        value: 'true'
      - key: SESSION_DAYS
        value: '7'

databases:
  - name: thewhitecoder-postgres
    region: singapore
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: '17'
    databaseName: study_sheets
    user: study_sheets
    ipAllowList: []
